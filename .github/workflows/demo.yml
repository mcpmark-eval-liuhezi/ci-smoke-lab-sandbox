name: Demo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write artifact file
        run: |
          echo "CI smoke test artifact" > demo-build.txt
          cat demo-build.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
